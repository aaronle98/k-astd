<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Date · Kim &amp; Aaron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:wght@400;500&family=Pinyon+Script&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;
  --sage:#9CAF94; --sage-l:#B7C6AF; --sage-d:#7D9476; --sage-dd:#5D7357;
  --green:#2F4636; --blush:#F4C8CF; --rose:#C98290; --gold:#C2A36B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Jost',system-ui,sans-serif;color:var(--green);
  background:linear-gradient(180deg,#DCE5D5 0%,#E7ECE0 34%,#F2F2EA 68%,#F9F7F1 100%);
  background-attachment:fixed;overflow-x:hidden;
}
.glow{position:fixed;left:50%;top:52%;width:min(130vw,1150px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,252,244,.95) 0%,rgba(255,250,238,.5) 32%,rgba(255,250,238,0) 64%);pointer-events:none}
.bg-floral{position:fixed;opacity:.92;width:clamp(220px,32vw,440px);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(60,40,40,.12))}
.bg-floral.tr{right:-1.5%;top:-2%}
.bg-floral.bl{left:-1.5%;bottom:-2%;transform:rotate(180deg)}
@media (max-aspect-ratio:4/5){.bg-floral{width:46vw}}

.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;border-radius:150% 0 150% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate(0,-5vh) rotate(0deg)}
  25%{transform:translate(4vw,22vh) rotate(90deg)}
  50%{transform:translate(-2vw,50vh) rotate(180deg)}
  75%{transform:translate(5vw,78vh) rotate(270deg)}
  100%{transform:translate(1vw,108vh) rotate(360deg)}}

.stage{position:relative;min-height:100svh;overflow:hidden}
.env{position:absolute}
.parts{position:absolute;inset:0}
.env-back{position:absolute;inset:0;z-index:1;border-radius:6px;
  background:linear-gradient(180deg,#566C51,#667D60);
  box-shadow:0 34px 60px -22px rgba(45,65,40,.5),0 6px 14px -6px rgba(45,65,40,.3)}
.env-front{position:absolute;inset:0;z-index:3;pointer-events:none}
.env-front svg{display:block;width:100%;height:100%;filter:drop-shadow(0 -1px 1.5px rgba(40,60,35,.2))}
.env-note{position:absolute;left:0;right:0;bottom:11%;text-align:center;color:rgba(255,253,246,.92);
  font-family:'Jost',sans-serif;font-size:clamp(8px,1.9vw,10.5px);letter-spacing:.32em;text-transform:uppercase}
.flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
  transform:perspective(1400px) rotateX(0deg)}
.flap .face{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .outer{background:linear-gradient(180deg,#B3C3AB 0%,var(--sage) 70%,#91A589 100%)}
.flap .inner{transform:rotateX(180deg);clip-path:polygon(0 100%,100% 100%,50% 0);
  background:
    radial-gradient(circle at 25% 25%,#F4C8CF 0 2.6px,transparent 3.2px) 0 0/22px 22px,
    radial-gradient(circle at 75% 75%,#B4C4AC 0 2.6px,transparent 3.2px) 0 0/22px 22px,
    #FBF8F1}
.flap-border{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.seal-sprig{position:absolute;left:50%;top:58%;z-index:5;width:clamp(150px,46%,230px);transform:translate(-50%,-50%);pointer-events:none}
.seal{position:absolute;left:50%;top:58%;z-index:6;width:clamp(58px,17%,84px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
  transform:translate(-50%,-50%);display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#F1D9A9 0%,#CDA563 42%,#A07A3D 78%,#86622D 100%);
  box-shadow:0 6px 14px -4px rgba(60,40,10,.5),inset 0 -3px 6px rgba(80,50,10,.35),inset 0 2px 3px rgba(255,240,210,.45);
  color:#FFF8E8;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(17px,4.2vw,24px);
  animation:glow 2.4s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:13%;border-radius:50%;border:1.5px solid rgba(255,238,205,.55)}
.seal span{position:relative;text-shadow:0 1px 1px rgba(70,45,10,.45);font-style:italic}
.seal:focus-visible{outline:2px solid var(--green);outline-offset:4px}
@keyframes glow{0%,100%{box-shadow:0 6px 14px -4px rgba(60,40,10,.5),inset 0 -3px 6px rgba(80,50,10,.35),inset 0 2px 3px rgba(255,240,210,.45),0 0 0 0 rgba(255,250,235,0)}
  50%{box-shadow:0 6px 14px -4px rgba(60,40,10,.5),inset 0 -3px 6px rgba(80,50,10,.35),inset 0 2px 3px rgba(255,240,210,.45),0 0 0 12px rgba(255,250,235,.4)}}

.card{position:absolute;left:50%;top:50%;z-index:2;border-radius:3px;container-type:inline-size;overflow:hidden;
  box-shadow:0 1px 2px rgba(40,40,40,.08),0 30px 60px -22px rgba(40,50,40,.42);will-change:transform;background:#FFFFFF;color:#2A2A2A}
.c-floral{position:absolute;pointer-events:none}
.c-floral.tr{right:-4cqw;top:-4cqw;width:62cqw}
.c-floral.bl{left:-5cqw;bottom:-5cqw;width:46cqw;transform:rotate(180deg)}
/* Delicate top-left and bottom-right corner flourishes on the invitation card */
.c-corner{position:absolute;pointer-events:none;width:27cqw;height:27cqw}
.c-corner.tl{left:2.4cqw;top:2.4cqw}
.c-corner.br{right:2.4cqw;bottom:2.4cqw;transform:rotate(180deg)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:31cqw}
.content>*{flex-shrink:0}
.std{font-family:'Playfair Display',serif;font-weight:400;font-size:13.2cqw;line-height:1;letter-spacing:.2em;margin-right:-.2em;color:#222}
.the{display:flex;align-items:center;gap:2cqw;font-family:'Pinyon Script',cursive;font-size:8.4cqw;line-height:1;color:#333;margin:-.6cqw 0 -.4cqw}
.the::before,.the::after{content:"";height:1px;width:15cqw;background:#3a3a3a;opacity:.75}
.the::before{background:linear-gradient(90deg,transparent,#3a3a3a)}
.the::after{background:linear-gradient(90deg,#3a3a3a,transparent)}
.for{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:4cqw;margin-top:5.5cqw;color:#444}
.names{font-family:'Playfair Display',serif;font-weight:400;font-size:6.6cqw;letter-spacing:.08em;margin-top:2.4cqw;color:#222;white-space:nowrap}
.daterow{font-family:'Playfair Display',serif;font-size:5.6cqw;letter-spacing:.08em;margin-top:3.6cqw;color:#222;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.year,.place{font-family:'Cormorant Garamond',serif;font-size:4cqw;color:#333;letter-spacing:.01em}
.year{margin-top:4cqw}
.place{margin-top:2.4cqw}
.note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:4cqw;line-height:1.15;margin-top:3.6cqw;color:#444}
.hint{position:absolute;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2.4vw,22px);color:var(--sage-dd)}
.details{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,640px);text-align:center;opacity:0;visibility:hidden}
.count{font-family:'Cormorant Garamond',serif;font-size:clamp(21px,3vw,27px);color:var(--green);font-variant-numeric:lining-nums}
.count strong{font-weight:600;font-size:1.3em;color:var(--rose);margin-right:.18em}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{font:500 12.5px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  padding:14px 22px;border-radius:999px;border:1px solid var(--sage-dd);background:var(--sage-dd);color:#FBF8F1;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:rgba(255,253,246,.6);color:var(--sage-dd)}
.btn.ghost:hover{background:rgba(255,253,246,.95)}
.spark{position:absolute;pointer-events:none;z-index:20;border-radius:150% 0 150% 0}
</style>
</head>

<div class="petals" id="petals" aria-hidden="true"></div>

<main class="stage" id="stage">
  <div class="env" id="env">

      <div class="env-front" aria-hidden="true">

          <!-- Matching thicker border on the inner face of the triangle flap when flipped open -->
          <svg class="flap-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

      <button class="btn ghost" id="replay">Replay</button>

</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), env = $('env'), parts = $('parts'), flap = $('flap'), seal = $('seal'), sprig = $('sprig'),
        card = $('card'), hint = $('hint'), details = $('details');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let L = {}, state = 'closed', autoTimer, petalShowerTimer = null;
  const petalColors = ['#F7D3DA', '#FCE3E8', '#EBAAB6', '#FFF5F7', '#C9D5C2', '#B7C6AF'];

  const tf = p => `translate(-50%,-50%) translate(${p.x}px,${p.y}px) scale(${p.s}) rotate(${p.r}deg)`;
  const flapT = d => `perspective(1400px) rotateX(${d}deg)`;
  const sealT = (s, y = -50) => `translate(-50%,${y}%) scale(${s})`;

  function layout() {
    const vw = window.innerWidth, vh = Math.max(window.innerHeight, 560);
    const E = Math.min(vw * 0.86, 480, vh * 0.6), Eh = E / 1.45;
    const ecx = vw / 2, ecy = vh * 0.57;
    Object.assign(env.style, { width: E + 'px', height: Eh + 'px', left: (ecx - E / 2) + 'px', top: (ecy - Eh / 2) + 'px' });

    const portrait = true;
    let Cw, Ch, s0, h0;
    if (portrait) {
      Cw = Math.min(vw * 0.86, (vh * 0.74) / 1.4, 500); Ch = Cw * 1.4;
      s0 = Math.min((E * 0.9) / Ch, (Eh * 0.88) / Cw); h0 = Cw * s0;
    } else {
      Cw = Math.min(vw * 0.92, 740, vh * 0.6 * 1.4); Ch = Cw / 1.4;
      s0 = (E * 0.9) / Cw; h0 = Ch * s0;
    }
    card.style.width = Cw + 'px'; card.style.height = Ch + 'px';
    const r0 = portrait ? -90 : 0;
    const fcy = Math.max(Ch / 2 + (vw < 600 ? 32 : 44), vh * 0.42);

    L = { E, Eh, Cw, Ch, cx: ecx, cy: fcy, portrait,
      start: { x: 0, y: 0, s: s0, r: r0 },
      rise:  { x: 0, y: -(Eh / 2 + h0 / 2 + 14), s: s0, r: r0 },
      end:   { x: 0, y: fcy - ecy, s: 1, r: 0 } };

    hint.style.top = (ecy + Eh / 2 + 30) + 'px';
    const dTop = fcy + Ch / 2 + (vw < 600 ? 28 : 38);
    details.style.top = dTop + 'px';
    stage.style.height = Math.max(window.innerHeight, dTop + details.offsetHeight + 60) + 'px';

    if (state === 'closed') card.style.transform = tf(L.start);
    if (state === 'open') card.style.transform = tf(L.end);
  }

  function run(el, frames, opts) {
    const a = el.animate(frames, { fill: 'forwards', ...opts });
    return a.finished.then(() => {
      const last = frames[frames.length - 1];
      for (const k in last) if (k !== 'offset' && k !== 'easing') el.style[k] = last[k];
      a.cancel();
    });
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function open() {
    if (state !== 'closed') return;
    state = 'opening'; clearTimeout(autoTimer);
    seal.disabled = true; seal.style.animation = 'none';
    run(hint, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
    run(sprig, [{ opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }, { opacity: 0, transform: 'translate(-50%,-62%) scale(.8)' }], { duration: 480, easing: 'ease-in' });
    await run(seal, [
      { transform: sealT(1), opacity: 1 },
      { transform: sealT(1.14), opacity: 1, offset: .35 },
      { transform: sealT(.55, -75), opacity: 0 }
    ], { duration: 480, easing: 'ease-in' });

    setTimeout(() => { flap.style.zIndex = 0; }, 430);
    await run(flap, [{ transform: flapT(0) }, { transform: flapT(180) }], { duration: 880, easing: 'cubic-bezier(.55,.05,.3,1)' });

    await wait(120);
    await run(card, [{ transform: tf(L.start) }, { transform: tf(L.rise) }], { duration: 1000, easing: 'cubic-bezier(.45,0,.2,1)' });

    card.style.zIndex = 10;
    const mid = { x: 0, y: (L.rise.y + L.end.y) / 2 - 30, s: (L.rise.s + 1) / 2, r: L.portrait ? -30 : -3.5 };
    run(parts, [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(60vh)', opacity: 0 }],
        { duration: 1000, easing: 'cubic-bezier(.55,0,.75,.2)' });
    await run(card, [
      { transform: tf(L.rise) },
      { transform: tf(mid), offset: .45 },
      { transform: tf({ ...L.end, s: 1.015, r: .6 }), offset: .82 },
      { transform: tf(L.end) }
    ], { duration: 1350, easing: 'cubic-bezier(.33,.0,.2,1)' });

    state = 'open';
    card.style.transform = tf(L.end);
    parts.style.visibility = 'hidden';
    burst();
    startPetalShower();
    details.style.visibility = 'visible';
    run(details, [{ opacity: 0, transform: 'translate(-50%,12px)' }, { opacity: 1, transform: 'translate(-50%,0)' }],
        { duration: 700, delay: 150, easing: 'ease-out' });
  }

  // Abundant burst of blush pink, dusty rose, sage, and cream petals from the card's edge as it lands
  function burst() {
    const colors = ['#F7D3DA', '#FCE3E8', '#EBAAB6', '#B7C6AF', '#FFF5F7', '#9CAF94'];
    const n = 80;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.45;
      const edgeScale = 0.88 + Math.random() * 0.14;
      const x0 = L.cx + Math.cos(a) * (L.Cw / 2) * edgeScale;
      const y0 = L.cy + Math.sin(a) * (L.Ch / 2) * edgeScale;
      const d = 35 + Math.random() * 125;
      const w = 6 + Math.random() * 10;
      const driftY = 30 + Math.random() * 55;
      Object.assign(s.style, {
        left: x0 + 'px',
        top: y0 + 'px',
        width: w + 'px',
        height: w * (0.68 + Math.random() * 0.25) + 'px',
        background: colors[i % colors.length]
      });
      stage.appendChild(s);
      const rot = Math.random() * 360;
      const spin = (Math.random() > 0.5 ? 1 : -1) * (200 + Math.random() * 220);
      s.animate([
        { transform: `translate(-50%,-50%) scale(0) rotate(${rot}deg)`, opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d * 0.58}px), calc(-50% + ${Math.sin(a) * d * 0.58}px)) scale(1.05) rotate(${rot + spin * 0.45}deg)`, opacity: 0.96, offset: 0.38 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + driftY}px)) scale(0.55) rotate(${rot + spin}deg)`, opacity: 0 }
      ], {
        duration: 1450 + Math.random() * 1100,
        delay: Math.random() * 180,
        easing: 'cubic-bezier(.2,.7,.3,1)'
      }).finished.then(() => s.remove());
    }
  }

  // Spawn a single gentle falling petal and remove it once its animation completes
  function spawnFallingPetal(initialDelay = 0) {
    const box = $('petals');
    if (!box) return;
    const p = document.createElement('span');
    p.className = 'petal';
    const w = 8 + Math.random() * 9;
    const duration = 12 + Math.random() * 11;
    Object.assign(p.style, {
      left: Math.random() * 100 + 'vw',
      width: w + 'px',
      height: w * 0.75 + 'px',
      background: petalColors[Math.floor(Math.random() * petalColors.length)],
      animationDuration: duration + 's',
      animationDelay: initialDelay + 's',
      opacity: 0.55 + Math.random() * 0.35
    });
    box.appendChild(p);
    if (initialDelay >= 0) {
      p.addEventListener('animationend', () => p.remove(), { once: true });
      setTimeout(() => { if (p.isConnected) p.remove(); }, (duration + initialDelay + 1) * 1000);
    }
  }

  // Continuous gentle shower spawning 2-3 new petals every second once opened
  function startPetalShower() {
    if (reduce) return;
    stopPetalShower();
    const spawnBatch = () => {
      if (state !== 'open') return;
      const count = Math.random() < 0.5 ? 2 : 3;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (state === 'open') spawnFallingPetal(0);
        }, i * 320 + Math.random() * 140);
      }
    };
    spawnBatch();
    petalShowerTimer = setInterval(spawnBatch, 1000);
  }

  function stopPetalShower() {
    if (petalShowerTimer) {
      clearInterval(petalShowerTimer);
      petalShowerTimer = null;
    }
  }

  function petals() {
    if (reduce) return;
    const n = window.innerWidth < 600 ? 10 : 18;
    for (let i = 0; i < n; i++) {
      spawnFallingPetal(-Math.random() * 25);
    }
  }

  function showFinal() {
    state = 'open';
    parts.style.visibility = 'hidden';
    hint.style.opacity = 0;
    card.style.zIndex = 10;
    card.style.transform = tf(L.end);
    startPetalShower();
    details.style.visibility = 'visible'; details.style.opacity = 1;
  }

  function reset() {
    state = 'closed';
    stopPetalShower();
    Object.assign(parts.style, { visibility: 'visible', opacity: 1, transform: 'none' });
    flap.style.transform = flapT(0); flap.style.zIndex = 4;
    Object.assign(seal.style, { transform: sealT(1), opacity: 1, animation: '' });
    Object.assign(sprig.style, { transform: '', opacity: 1 });
    seal.disabled = false;
    card.style.zIndex = 2; card.style.transform = tf(L.start);
    Object.assign(details.style, { opacity: 0, visibility: 'hidden', transform: '' });
    hint.style.opacity = 1;
  }

  function countdown() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((new Date(2027, 9, 23) - today) / 864e5);
    if (days > 1) { $('days').textContent = days; $('daysLabel').textContent = 'days to go'; }
    else if (days === 1) { $('days').textContent = '1'; $('daysLabel').textContent = 'day to go'; }
    else if (days === 0) { $('days').textContent = ''; $('daysLabel').textContent = 'Today’s the day!'; }
    else { $('days').textContent = ''; $('daysLabel').textContent = 'Just married · October 23, 2027'; }
  }

  seal.addEventListener('click', open);
  $('replay').addEventListener('click', () => { reset(); setTimeout(open, 700); });
  window.addEventListener('resize', layout);

  countdown();
  petals();
  layout();
  if (reduce) { showFinal(); }
  else {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
      layout();
      autoTimer = setTimeout(open, 2600);
    });
  }
})();
</script>
