<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Date · Aaron &amp; Kim Le</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;
  --sage:#9CAF94; --sage-l:#B7C6AF; --sage-d:#7D9476; --sage-dd:#5D7357;
  --green:#2F4636; --blush:#D9A7A0; --rose:#B97D76; --gold:#C2A36B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Jost',system-ui,sans-serif;color:var(--green);
  background:linear-gradient(180deg,#DCE5D5 0%,#E7ECE0 34%,#F2F2EA 68%,#F9F7F1 100%);
  background-attachment:fixed;overflow-x:hidden;
}
.glow{position:fixed;left:50%;top:52%;width:min(130vw,1150px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,252,244,.95) 0%,rgba(255,250,238,.5) 32%,rgba(255,250,238,0) 64%);pointer-events:none}
.bg-floral{position:fixed;width:clamp(200px,34vw,460px);pointer-events:none;opacity:.95;filter:drop-shadow(0 6px 10px rgba(60,80,55,.12))}
.bg-floral.tl{left:-2.5%;top:-3%}
.bg-floral.br{right:-2.5%;bottom:-3%;transform:rotate(180deg)}
.bg-floral.tr{right:-4%;top:-5%;transform:scaleX(-1);width:clamp(120px,18vw,260px);opacity:.75}
.bg-floral.bl{left:-4%;bottom:-5%;transform:scaleY(-1);width:clamp(120px,18vw,260px);opacity:.75}
@media (max-aspect-ratio:4/5){.bg-floral.tr,.bg-floral.bl{display:none}.bg-floral.tl,.bg-floral.br{width:50vw}}

.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;border-radius:150% 0 150% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate(0,-5vh) rotate(0deg)}
  25%{transform:translate(4vw,22vh) rotate(90deg)}
  50%{transform:translate(-2vw,50vh) rotate(180deg)}
  75%{transform:translate(5vw,78vh) rotate(270deg)}
  100%{transform:translate(1vw,108vh) rotate(360deg)}}

.stage{position:relative;min-height:100svh;overflow:hidden}
.env{position:absolute}
.parts{position:absolute;inset:0}
.env-back{position:absolute;inset:0;z-index:1;border-radius:6px;
  background:linear-gradient(180deg,#566C51,#667D60);
  box-shadow:0 34px 60px -22px rgba(45,65,40,.5),0 6px 14px -6px rgba(45,65,40,.3)}
.env-front{position:absolute;inset:0;z-index:3;pointer-events:none}
.env-front svg{display:block;width:100%;height:100%;filter:drop-shadow(0 -1px 1.5px rgba(40,60,35,.2))}
.env-note{position:absolute;left:0;right:0;bottom:11%;text-align:center;color:rgba(255,253,246,.92);
  font-family:'Jost',sans-serif;font-size:clamp(8px,1.9vw,10.5px);letter-spacing:.32em;text-transform:uppercase}
.flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
  transform:perspective(1400px) rotateX(0deg)}
.flap .face{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .outer{background:linear-gradient(180deg,#B3C3AB 0%,var(--sage) 70%,#91A589 100%)}
.flap .inner{transform:rotateX(180deg);clip-path:polygon(0 100%,100% 100%,50% 0);
  background:
    radial-gradient(circle at 25% 25%,#E6BDB6 0 2.6px,transparent 3.2px) 0 0/22px 22px,
    radial-gradient(circle at 75% 75%,#B4C4AC 0 2.6px,transparent 3.2px) 0 0/22px 22px,
    #FBF8F1}
.seal-sprig{position:absolute;left:50%;top:58%;z-index:5;width:clamp(150px,46%,230px);transform:translate(-50%,-50%);pointer-events:none}
.seal{position:absolute;left:50%;top:58%;z-index:6;width:clamp(58px,17%,84px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
  transform:translate(-50%,-50%);display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#F1D9A9 0%,#CDA563 42%,#A07A3D 78%,#86622D 100%);
  box-shadow:0 6px 14px -4px rgba(60,40,10,.5),inset 0 -3px 6px rgba(80,50,10,.35),inset 0 2px 3px rgba(255,240,210,.45);
  color:#FFF8E8;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(17px,4.2vw,24px);
  animation:glow 2.4s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:13%;border-radius:50%;border:1.5px solid rgba(255,238,205,.55)}
.seal span{position:relative;text-shadow:0 1px 1px rgba(70,45,10,.45);font-style:italic}
.seal:focus-visible{outline:2px solid var(--green);outline-offset:4px}
@keyframes glow{0%,100%{box-shadow:0 6px 14px -4px rgba(60,40,10,.5),inset 0 -3px 6px rgba(80,50,10,.35),inset 0 2px 3px rgba(255,240,210,.45),0 0 0 0 rgba(255,250,235,0)}
  50%{box-shadow:0 6px 14px -4px rgba(60,40,10,.5),inset 0 -3px 6px rgba(80,50,10,.35),inset 0 2px 3px rgba(255,240,210,.45),0 0 0 12px rgba(255,250,235,.4)}}

.card{position:absolute;left:50%;top:50%;z-index:2;border-radius:3px;container-type:inline-size;
  box-shadow:0 1px 2px rgba(40,60,35,.08),0 28px 60px -22px rgba(40,60,35,.4);will-change:transform;
  background:radial-gradient(circle at 50% 42%,#FFFEFA 0%,#FFFBF3 68%,#F8F2E6 100%)}
.frame{position:absolute;inset:3cqw;border:1px solid var(--gold)}
.frame::after{content:"";position:absolute;inset:.9cqw;border:.5px solid rgba(194,163,107,.65)}
.c-floral{position:absolute;width:27cqw;pointer-events:none}
.c-floral.tl{left:.6cqw;top:.6cqw}
.c-floral.br{right:.6cqw;bottom:.6cqw;transform:rotate(180deg)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6cqw}
.kicker{font-size:2.05cqw;letter-spacing:.5em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-right:-.5em}
.names{font-family:'Pinyon Script',cursive;font-weight:400;font-size:8.2cqw;line-height:1.25;margin:1cqw 0 0;padding:0 .2em;color:var(--green);white-space:nowrap}
.names .amp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:.92em;color:var(--sage-d);padding:0 .12em;display:inline-block}
.date{display:flex;align-items:center;gap:2.4cqw;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:17.5cqw;line-height:1;color:var(--green);
  font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;letter-spacing:.01em;margin-top:.5cqw}
.date i{width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--blush);display:block}
.divider{width:24cqw;height:auto;margin:2cqw 0 1.6cqw;display:block}
.when,.where{font-size:1.95cqw;letter-spacing:.3em;text-transform:uppercase;margin-right:-.3em;color:var(--green)}
.where{margin-top:1cqw;color:var(--sage-d);font-weight:500}
.note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.5cqw;margin-top:1.6cqw;color:#6A7568}

.card.portrait .frame{inset:3.6cqw}
.card.portrait .frame::after{inset:1.2cqw}
.card.portrait .c-floral{width:33cqw}
.card.portrait .content{padding:9cqw 7cqw}
.card.portrait .kicker{font-size:3.3cqw;margin-top:8cqw}
.card.portrait .names{font-size:14cqw;line-height:1.12;margin:4cqw 0 3cqw}
.card.portrait .names .ln{display:block}
.card.portrait .date{font-size:21cqw;gap:2.6cqw}
.card.portrait .date i{width:1.9cqw;height:1.9cqw}
.card.portrait .divider{width:40cqw;margin:5cqw 0 4.5cqw}
.card.portrait .when,.card.portrait .where{font-size:3.1cqw;letter-spacing:.24em;margin-right:-.24em}
.card.portrait .where{margin-top:2.2cqw}
.card.portrait .note{font-size:4.3cqw;margin-top:4cqw;margin-bottom:8cqw}

.hint{position:absolute;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2.4vw,22px);color:var(--sage-dd)}
.details{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,640px);text-align:center;opacity:0;visibility:hidden}
.count{font-family:'Cormorant Garamond',serif;font-size:clamp(21px,3vw,27px);color:var(--green);font-variant-numeric:lining-nums}
.count strong{font-weight:600;font-size:1.3em;color:var(--rose);margin-right:.18em}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{font:500 12.5px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  padding:14px 22px;border-radius:999px;border:1px solid var(--sage-dd);background:var(--sage-dd);color:#FBF8F1;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:rgba(255,253,246,.6);color:var(--sage-dd)}
.btn.ghost:hover{background:rgba(255,253,246,.95)}
.spark{position:absolute;pointer-events:none;z-index:20;border-radius:150% 0 150% 0}
</style>
</head>

<use href="#rose" width="104" height="104" transform="translate(20.0,20.0) rotate(12 52.0 52.0)"/>
<use href="#blossom" width="30" height="30" transform="translate(150.0,75.0) rotate(40 15.0 15.0)"/>

    </g>
  </defs>
</svg>

<div class="glow" aria-hidden="true"></div>
<svg class="bg-floral tl" viewBox="0 0 270 270" aria-hidden="true"><use href="#bouquet"/></svg>
<svg class="bg-floral tr" viewBox="0 0 270 270" aria-hidden="true"><use href="#bouquet"/></svg>
<svg class="bg-floral bl" viewBox="0 0 270 270" aria-hidden="true"><use href="#bouquet"/></svg>
<svg class="bg-floral br" viewBox="0 0 270 270" aria-hidden="true"><use href="#bouquet"/></svg>
<div class="petals" id="petals" aria-hidden="true"></div>

<main class="stage" id="stage">
  <div class="env" id="env">
    <div class="parts" id="parts">
      <div class="env-back"></div>
      <div class="env-front" aria-hidden="true">
        <svg viewBox="0 0 100 69" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#8DA285"/><stop offset="1" stop-color="#9DB096"/></linearGradient>
            <linearGradient id="gr" x1="1" x2="0"><stop offset="0" stop-color="#8DA285"/><stop offset="1" stop-color="#9DB096"/></linearGradient>
            <linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#859A7E"/><stop offset="1" stop-color="#A5B79E"/></linearGradient>
          </defs>
          <polygon points="0,0 50,38 0,69" fill="url(#gl)"/>
          <polygon points="100,0 50,38 100,69" fill="url(#gr)"/>
          <polygon points="0,69 50,31 100,69" fill="url(#gb)" stroke="rgba(50,70,45,.18)" stroke-width=".25"/>
        </svg>
        <div class="env-note">Orange County · California</div>
      </div>
      <div class="flap" id="flap">
        <div class="face outer"></div>
        <div class="face inner"></div>
      </div>
      <svg class="seal-sprig" id="sprig" viewBox="-80 -50 160 100" aria-hidden="true">
        <use href="#leaf" width="22" height="56" fill="#6F8868" transform="rotate(-62) translate(-11,-60)"/>
        <use href="#leaf" width="22" height="56" fill="#A3B79A" transform="rotate(-30) translate(-11,-58)"/>
        <use href="#leaf" width="22" height="56" fill="#6F8868" transform="rotate(62) translate(-11,-60)"/>
        <use href="#leaf" width="22" height="56" fill="#A3B79A" transform="rotate(30) translate(-11,-58)"/>
        <use href="#blossom" width="26" height="26" transform="translate(-58,-6)"/>
        <use href="#bud" width="28" height="28" transform="translate(32,-8)"/>
      </svg>
      <button class="seal" id="seal" aria-label="Open the envelope"><span>A&amp;K</span></button>
    </div>

    <article class="card" id="card" aria-label="Save the date card">
      <div class="frame"></div>
      <svg class="c-floral tl" viewBox="0 0 270 270" aria-hidden="true"><use href="#bouquet"/></svg>
      <svg class="c-floral br" viewBox="0 0 270 270" aria-hidden="true"><use href="#bouquet"/></svg>
      <div class="content">
        <p class="kicker">Save the Date</p>
        <h1 class="names"><span class="ln">Aaron <span class="amp">&amp;</span></span> <span class="ln">Kim Le</span></h1>
        <div class="date" aria-label="October 23, 2027"><span>10</span><i></i><span>23</span><i></i><span>27</span></div>
        <svg class="divider" viewBox="0 0 160 30" aria-hidden="true">
          <line x1="2" y1="15" x2="52" y2="15" stroke="#C2A36B" stroke-width="1"/>
          <line x1="108" y1="15" x2="158" y2="15" stroke="#C2A36B" stroke-width="1"/>
          <use href="#leaf" width="10" height="24" fill="#8FA588" transform="translate(80,15) rotate(-118) translate(-5,-24)"/>
          <use href="#leaf" width="10" height="24" fill="#8FA588" transform="translate(80,15) rotate(118) translate(-5,-24)"/>
          <use href="#leaf" width="9" height="20" fill="#A3B79A" transform="translate(80,15) rotate(-70) translate(-4.5,-20)"/>
          <use href="#leaf" width="9" height="20" fill="#A3B79A" transform="translate(80,15) rotate(70) translate(-4.5,-20)"/>
          <use href="#rose" width="22" height="22" x="69" y="4"/>
        </svg>
        <p class="when">Saturday · October 23, 2027</p>
        <p class="where">Orange County, California</p>
        <p class="note">Formal invitation to follow</p>
      </div>
    </article>
  </div>

  <p class="hint" id="hint">Tap the seal to open</p>

  <section class="details" id="details">
    <p class="count"><strong id="days">—</strong><span id="daysLabel">days to go</span></p>
    <div class="actions">
      <a class="btn" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Aaron%20%26%20Kim%20Le%20%E2%80%94%20Wedding&amp;dates=20271023%2F20271024&amp;location=Orange%20County%2C%20California&amp;details=Save%20the%20date!%20Formal%20invitation%20to%20follow.">Add to calendar</a>
      <button class="btn ghost" id="replay">Replay</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), env = $('env'), parts = $('parts'), flap = $('flap'), seal = $('seal'), sprig = $('sprig'),
        card = $('card'), hint = $('hint'), details = $('details');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let L = {}, state = 'closed', autoTimer;

  const tf = p => `translate(-50%,-50%) translate(${p.x}px,${p.y}px) scale(${p.s}) rotate(${p.r}deg)`;
  const flapT = d => `perspective(1400px) rotateX(${d}deg)`;
  const sealT = (s, y = -50) => `translate(-50%,${y}%) scale(${s})`;

  function layout() {
    const vw = window.innerWidth, vh = Math.max(window.innerHeight, 560);
    const E = Math.min(vw * 0.86, 480, vh * 0.6), Eh = E / 1.45;
    const ecx = vw / 2, ecy = vh * 0.57;
    Object.assign(env.style, { width: E + 'px', height: Eh + 'px', left: (ecx - E / 2) + 'px', top: (ecy - Eh / 2) + 'px' });

    const portrait = vw / vh < 0.8;
    card.classList.toggle('portrait', portrait);
    let Cw, Ch, s0, h0;
    if (portrait) {
      Cw = Math.min(vw * 0.86, (vh * 0.7) / 1.4); Ch = Cw * 1.4;
      s0 = Math.min((E * 0.9) / Ch, (Eh * 0.88) / Cw); h0 = Cw * s0;
    } else {
      Cw = Math.min(vw * 0.92, 740, vh * 0.6 * 1.4); Ch = Cw / 1.4;
      s0 = (E * 0.9) / Cw; h0 = Ch * s0;
    }
    card.style.width = Cw + 'px'; card.style.height = Ch + 'px';
    const r0 = portrait ? -90 : 0;
    const fcy = Math.max(Ch / 2 + (vw < 600 ? 32 : 44), vh * 0.42);

    L = { E, Eh, Cw, Ch, cx: ecx, cy: fcy, portrait,
      start: { x: 0, y: 0, s: s0, r: r0 },
      rise:  { x: 0, y: -(Eh / 2 + h0 / 2 + 14), s: s0, r: r0 },
      end:   { x: 0, y: fcy - ecy, s: 1, r: 0 } };

    hint.style.top = (ecy + Eh / 2 + 30) + 'px';
    const dTop = fcy + Ch / 2 + (vw < 600 ? 28 : 38);
    details.style.top = dTop + 'px';
    stage.style.height = Math.max(window.innerHeight, dTop + details.offsetHeight + 60) + 'px';

    if (state === 'closed') card.style.transform = tf(L.start);
    if (state === 'open') card.style.transform = tf(L.end);
  }

  function run(el, frames, opts) {
    const a = el.animate(frames, { fill: 'forwards', ...opts });
    return a.finished.then(() => {
      const last = frames[frames.length - 1];
      for (const k in last) if (k !== 'offset' && k !== 'easing') el.style[k] = last[k];
      a.cancel();
    });
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function open() {
    if (state !== 'closed') return;
    state = 'opening'; clearTimeout(autoTimer);
    seal.disabled = true; seal.style.animation = 'none';
    run(hint, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
    run(sprig, [{ opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }, { opacity: 0, transform: 'translate(-50%,-62%) scale(.8)' }], { duration: 480, easing: 'ease-in' });
    await run(seal, [
      { transform: sealT(1), opacity: 1 },
      { transform: sealT(1.14), opacity: 1, offset: .35 },
      { transform: sealT(.55, -75), opacity: 0 }
    ], { duration: 480, easing: 'ease-in' });

    setTimeout(() => { flap.style.zIndex = 0; }, 430);
    await run(flap, [{ transform: flapT(0) }, { transform: flapT(180) }], { duration: 880, easing: 'cubic-bezier(.55,.05,.3,1)' });

    await wait(120);
    await run(card, [{ transform: tf(L.start) }, { transform: tf(L.rise) }], { duration: 1000, easing: 'cubic-bezier(.45,0,.2,1)' });

    card.style.zIndex = 10;
    const mid = { x: 0, y: (L.rise.y + L.end.y) / 2 - 30, s: (L.rise.s + 1) / 2, r: L.portrait ? -30 : -3.5 };
    run(parts, [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(60vh)', opacity: 0 }],
        { duration: 1000, easing: 'cubic-bezier(.55,0,.75,.2)' });
    await run(card, [
      { transform: tf(L.rise) },
      { transform: tf(mid), offset: .45 },
      { transform: tf({ ...L.end, s: 1.015, r: .6 }), offset: .82 },
      { transform: tf(L.end) }
    ], { duration: 1350, easing: 'cubic-bezier(.33,.0,.2,1)' });

    state = 'open';
    card.style.transform = tf(L.end);
    parts.style.visibility = 'hidden';
    burst();
    details.style.visibility = 'visible';
    run(details, [{ opacity: 0, transform: 'translate(-50%,12px)' }, { opacity: 1, transform: 'translate(-50%,0)' }],
        { duration: 700, delay: 150, easing: 'ease-out' });
  }

  // A soft burst of petals from the card's edge as it lands
  function burst() {
    const colors = ['#EBC3BC', '#D9A7A0', '#B7C6AF', '#9CAF94', '#FFF8EE', '#E3C78F'];
    const n = 34;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const a = (i / n) * Math.PI * 2 + Math.random() * .3;
      const x0 = L.cx + Math.cos(a) * L.Cw / 2 * .96, y0 = L.cy + Math.sin(a) * L.Ch / 2 * .96;
      const d = 45 + Math.random() * 80, w = 7 + Math.random() * 8;
      Object.assign(s.style, { left: x0 + 'px', top: y0 + 'px', width: w + 'px', height: w * .8 + 'px', background: colors[i % colors.length] });
      stage.appendChild(s);
      const rot = Math.random() * 360;
      s.animate([
        { transform: `translate(-50%,-50%) scale(0) rotate(${rot}deg)`, opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d * .6}px), calc(-50% + ${Math.sin(a) * d * .6}px)) scale(1) rotate(${rot + 120}deg)`, opacity: 1, offset: .4 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 40}px)) scale(.6) rotate(${rot + 260}deg)`, opacity: 0 }
      ], { duration: 1500 + Math.random() * 800, easing: 'cubic-bezier(.2,.7,.3,1)' }).finished.then(() => s.remove());
    }
  }

  function petals() {
    if (reduce) return;
    const box = $('petals'), colors = ['#EBC3BC', '#E2B1A9', '#F6E1DB', '#C9D5C2', '#FFF8EE'];
    const n = window.innerWidth < 600 ? 10 : 18;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = 'petal';
      const w = 8 + Math.random() * 9;
      Object.assign(p.style, { left: Math.random() * 100 + 'vw', width: w + 'px', height: w * .75 + 'px',
        background: colors[i % colors.length], animationDuration: 13 + Math.random() * 12 + 's',
        animationDelay: -Math.random() * 25 + 's', opacity: .55 + Math.random() * .35 });
      box.appendChild(p);
    }
  }

  function showFinal() {
    state = 'open';
    parts.style.visibility = 'hidden';
    hint.style.opacity = 0;
    card.style.zIndex = 10;
    card.style.transform = tf(L.end);
    details.style.visibility = 'visible'; details.style.opacity = 1;
  }

  function reset() {
    state = 'closed';
    Object.assign(parts.style, { visibility: 'visible', opacity: 1, transform: 'none' });
    flap.style.transform = flapT(0); flap.style.zIndex = 4;
    Object.assign(seal.style, { transform: sealT(1), opacity: 1, animation: '' });
    Object.assign(sprig.style, { transform: '', opacity: 1 });
    seal.disabled = false;
    card.style.zIndex = 2; card.style.transform = tf(L.start);
    Object.assign(details.style, { opacity: 0, visibility: 'hidden', transform: '' });
    hint.style.opacity = 1;
  }

  function countdown() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((new Date(2027, 9, 23) - today) / 864e5);
    if (days > 1) { $('days').textContent = days; $('daysLabel').textContent = 'days to go'; }
    else if (days === 1) { $('days').textContent = '1'; $('daysLabel').textContent = 'day to go'; }
    else if (days === 0) { $('days').textContent = ''; $('daysLabel').textContent = 'Today’s the day!'; }
    else { $('days').textContent = ''; $('daysLabel').textContent = 'Just married · October 23, 2027'; }
  }

  seal.addEventListener('click', open);
  $('replay').addEventListener('click', () => { reset(); setTimeout(open, 700); });
  window.addEventListener('resize', layout);

  countdown();
  petals();
  layout();
  if (reduce) { showFinal(); }
  else {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
      layout();
      autoTimer = setTimeout(open, 2600);
    });
  }
})();
</script>
